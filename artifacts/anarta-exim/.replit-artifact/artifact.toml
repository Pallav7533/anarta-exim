kind = "web"
previewPath = "/"
title = "Anarta Exim"
version = "1.0.0"
id = "artifacts/anarta-exim"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25513

[services.development]
run = "pnpm --filter @workspace/anarta-exim run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/anarta-exim", "run", "build" ]
publicDir = "artifacts/anarta-exim/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25513"
BASE_PATH = "/"
